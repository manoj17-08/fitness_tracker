{% extends 'fitness/base.html' %}

{% block content %}
<h2 style="text-align: center; color: #0ec1ac; font-size: 36px; margin-bottom: 20px; text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);">Login</h2>
<form method="post" style="max-width: 400px; margin: 0 auto; padding: 20px; background-color: #f9f9f9; border-radius: 10px; box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);">
    {% csrf_token %}
    <div style="margin-bottom: 20px;">
        <label for="id_username" style="font-size: 18px; color: #555; font-weight: 600;">Username</label>
        <input type="text" name="username" id="id_username" placeholder="Enter your username" style="width: 100%; padding: 12px 18px; font-size: 16px; border: 2px solid #ccc; border-radius: 8px; box-sizing: border-box; transition: border 0.3s, box-shadow 0.3s; margin-top: 8px; background-color: #f9f9f9;">
    </div>
    <div style="margin-bottom: 20px;">
        <label for="id_password" style="font-size: 18px; color: #555; font-weight: 600;">Password</label>
        <input type="password" name="password" id="id_password" placeholder="Enter your password" style="width: 100%; padding: 12px 18px; font-size: 16px; border: 2px solid #ccc; border-radius: 8px; box-sizing: border-box; transition: border 0.3s, box-shadow 0.3s; margin-top: 8px; background-color: #f9f9f9;">
    </div>
    <button type="submit" style="display: inline-block; width: 100%; padding: 12px 24px; background: #0ec1ac; color: white; text-decoration: none; font-weight: bold; font-size: 18px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); transition: background 0.3s, transform 0.3s; cursor: pointer;">
        Login
    </button>
</form>
{% endblock %}
