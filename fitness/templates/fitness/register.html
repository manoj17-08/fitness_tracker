{% extends 'fitness/base.html' %}

{% block content %}
    <h2 style="text-align: center; color: #0ec1ac; font-size: 36px; margin-bottom: 20px; text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);">Create Your Account</h2>

    <form method="post" style="max-width: 400px; margin: 0 auto; padding: 30px; background-color: #f9f9f9; border-radius: 12px; box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);">
        {% csrf_token %}
        
        <!-- Username field -->
        <div style="margin-bottom: 20px;">
            <label for="id_username" style="font-size: 18px; color: #555; font-weight: 600;">Username</label>
            <input type="text" name="username" id="id_username" placeholder="Enter your username" value="{{ form.username.value|default:'' }}" style="width: 100%; padding: 12px 18px; font-size: 16px; border: 2px solid #ccc; border-radius: 8px; box-sizing: border-box; margin-top: 8px; background-color: #f9f9f9; transition: border 0.3s, box-shadow 0.3s;">
        </div>

        <!-- Email field -->
        <div style="margin-bottom: 20px;">
            <label for="id_email" style="font-size: 18px; color: #555; font-weight: 600;">Email</label>
            <input type="email" name="email" id="id_email" placeholder="Enter your email" value="{{ form.email.value|default:'' }}" style="width: 100%; padding: 12px 18px; font-size: 16px; border: 2px solid #ccc; border-radius: 8px; box-sizing: border-box; margin-top: 8px; background-color: #f9f9f9; transition: border 0.3s, box-shadow 0.3s;">
        </div>

        <!-- Password field -->
        <div style="margin-bottom: 20px;">
            <label for="id_password1" style="font-size: 18px; color: #555; font-weight: 600;">Password</label>
            <input type="password" name="password1" id="id_password1" placeholder="Create a password" style="width: 100%; padding: 12px 18px; font-size: 16px; border: 2px solid #ccc; border-radius: 8px; box-sizing: border-box; margin-top: 8px; background-color: #f9f9f9; transition: border 0.3s, box-shadow 0.3s;">
        </div>

        <!-- Confirm Password field -->
        <div style="margin-bottom: 30px;">
            <label for="id_password2" style="font-size: 18px; color: #555; font-weight: 600;">Confirm Password</label>
            <input type="password" name="password2" id="id_password2" placeholder="Confirm your password" style="width: 100%; padding: 12px 18px; font-size: 16px; border: 2px solid #ccc; border-radius: 8px; box-sizing: border-box; margin-top: 8px; background-color: #f9f9f9; transition: border 0.3s, box-shadow 0.3s;">
        </div>

        <!-- Submit button -->
        <button type="submit" style="display: inline-block; width: 100%; padding: 12px 24px; background: #0ec1ac; color: white; font-size: 18px; font-weight: bold; border-radius: 5px; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); cursor: pointer; transition: background 0.3s, transform 0.3s;">
            Register
        </button>

        <!-- Interactive feedback for form submission -->
        <div style="text-align: center; margin-top: 20px; font-size: 14px; color: #777;">
            Already have an account? <a href="{% url 'login' %}" style="color: #0ec1ac; text-decoration: none; font-weight: bold;">Login here</a>
        </div>
    </form>
{% endblock %}
