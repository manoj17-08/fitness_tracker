{% extends 'fitness/base.html' %}

{% block content %}
<h2>Add Activity</h2>

<!-- Button to open modal -->
<button id="openModal" style="background: #0ec1ac; color: white; padding: 12px 24px; font-size: 16px; border-radius: 5px; border: none; cursor: pointer;">Add Activity</button>

<!-- Modal -->
<div id="activityModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.5); z-index: 1000; justify-content: center; align-items: center;">
    <div style="background: white; padding: 30px; border-radius: 8px; width: 400px; text-align: center;">
        <h3>Add Activity</h3>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" style="display: inline-block; margin-top: 20px; padding: 12px 24px; background: #0ec1ac; color: white; text-decoration: none; font-weight: bold; font-size: 16px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2); transition: background 0.2s; cursor: pointer;">Save</button>
        </form>
        <button id="closeModal" style="margin-top: 20px; background: #ce1c1c; color: white; padding: 12px 24px; border-radius: 5px; border: none; cursor: pointer; font-weight: bold;">Close</button>
    </div>
</div>

<script>
    // Get modal and buttons
    var modal = document.getElementById("activityModal");
    var openModal = document.getElementById("openModal");
    var closeModal = document.getElementById("closeModal");

    // Open the modal when the "Add Activity" button is clicked
    openModal.onclick = function() {
        modal.style.display = "flex";
    }

    // Close the modal when the "Close" button is clicked
    closeModal.onclick = function() {
        modal.style.display = "none";
    }

    // Close the modal if the user clicks outside of the modal content
    window.onclick = function(event) {
        if (event.target === modal) {
            modal.style.display = "none";
        }
    }
</script>

{% endblock %}
